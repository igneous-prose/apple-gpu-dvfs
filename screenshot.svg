<svg xmlns="http://www.w3.org/2000/svg" width="720" height="820" viewBox="0 0 720 820">
  <defs>
    <style>
      .bg { fill: #1a1b26; }
      .titlebar { fill: #24283b; }
      .btn-close { fill: #f7768e; }
      .btn-min { fill: #e0af68; }
      .btn-max { fill: #9ece6a; }
      .t { font-family: 'SF Mono', 'Menlo', 'Consolas', monospace; font-size: 12px; fill: #a9b1d6; }
      .prompt { fill: #7aa2f7; }
      .cmd { fill: #c0caf5; font-weight: bold; }
      .green { fill: #9ece6a; }
      .cyan { fill: #7dcfff; }
      .yellow { fill: #e0af68; }
      .red { fill: #f7768e; }
      .dim { fill: #565f89; }
      .bold { fill: #c0caf5; font-weight: bold; }
      .title-text { font-family: 'SF Mono', 'Menlo', monospace; font-size: 13px; fill: #787c99; }
    </style>
  </defs>

  <!-- Window frame -->
  <rect class="bg" width="720" height="820" rx="10"/>
  <rect class="titlebar" width="720" height="36" rx="10"/>
  <rect class="titlebar" y="26" width="720" height="10"/>

  <!-- Traffic lights -->
  <circle class="btn-close" cx="20" cy="18" r="6"/>
  <circle class="btn-min" cx="40" cy="18" r="6"/>
  <circle class="btn-max" cx="60" cy="18" r="6"/>
  <text class="title-text" x="360" y="22" text-anchor="middle">gpu-dvfs — Apple M4</text>

  <!-- Terminal content -->
  <g transform="translate(16, 50)">
    <!-- Status -->
    <text class="prompt" x="0" y="0">$</text>
    <text class="cmd" x="14" y="0">sudo ./gpu-dvfs status</text>

    <text class="bold" x="0" y="20">── GPU DVFS Status ──</text>
    <text class="t" x="0" y="40">  Device:  AGXAcceleratorG16G (gpu,t8132, 10 cores)</text>

    <text class="bold" x="0" y="64">CLPC Power Budget:</text>
    <text class="t" x="0" y="80">  pkg-avg-max-power:     <tspan class="cyan">4.69 W</tspan></text>
    <text class="t" x="0" y="96">  pkg-lowpeak-max-power: 4.69 W</text>
    <text class="t" x="0" y="112">  power-zone-target-0:   7.19 W</text>
    <text class="t" x="0" y="128">  gpu-fraction:          50%</text>
    <text class="t" x="0" y="144">  pkg-low-power-target:  <tspan class="green">disabled</tspan> (full speed)</text>

    <text class="bold" x="0" y="168">GPU Benchmark</text><text class="t" x="102" y="168"> (2048×2048 FP32 matmul, best of 5):</text>
    <text class="bold" x="0" y="188">  559.8 GFLOPS</text><text class="green" x="110" y="188">  ← peak (P15)</text>

    <!-- Separator -->
    <text class="dim" x="0" y="216">───────────────────────────────────────────────────</text>

    <!-- Cap -->
    <text class="prompt" x="0" y="240">$</text>
    <text class="cmd" x="14" y="240">sudo ./gpu-dvfs set low</text>

    <text class="green" x="0" y="262">✓</text><text class="t" x="14" y="262">Saved original state to /tmp/.gpu_freq_ctl_saved_state</text>
    <text class="cyan" x="0" y="280">•</text><text class="t" x="14" y="280">Setting power cap to 2.0 W...</text>
    <text class="cyan" x="0" y="298">•</text><text class="t" x="14" y="298">Burning in GPU for 10s to trigger CLPC response...</text>
    <text class="green" x="0" y="318">✓</text><text class="t" x="14" y="318">GPU throttled: <tspan class="bold">41.2 GFLOPS</tspan> (cap 2.0 W active)</text>

    <text class="t" x="0" y="340">  Restore with: <tspan class="bold">sudo gpu-dvfs set max</tspan></text>

    <!-- Separator -->
    <text class="dim" x="0" y="366">───────────────────────────────────────────────────</text>

    <!-- Uncap -->
    <text class="prompt" x="0" y="390">$</text>
    <text class="cmd" x="14" y="390">sudo ./gpu-dvfs set max</text>

    <text class="cyan" x="0" y="412">•</text><text class="t" x="14" y="412">Restoring saved state...</text>
    <text class="green" x="0" y="430">✓</text><text class="t" x="14" y="430">CLPC properties restored</text>
    <text class="cyan" x="0" y="448">•</text><text class="t" x="14" y="448">Waiting 5s for CLPC to settle...</text>
    <text class="green" x="0" y="468">✓</text><text class="t" x="14" y="468">GPU recovered: <tspan class="bold">559.8 GFLOPS</tspan></text>

    <!-- Separator -->
    <text class="dim" x="0" y="496">───────────────────────────────────────────────────</text>

    <!-- Table (compact) -->
    <text class="prompt" x="0" y="520">$</text>
    <text class="cmd" x="14" y="520">./gpu-dvfs table</text>

    <text class="bold" x="0" y="542">── GPU DVFS Table (gpu,t8132, 16 P-states) ──</text>

    <text class="t" x="0" y="564">  P-state   Freq MHz   GPU mV   SRAM mV   Notes</text>
    <text class="dim" x="0" y="580">  ───────   ────────   ──────   ───────   ─────</text>
    <text class="dim" x="0" y="596">  P0            0        125      780     idle/retention</text>
    <text class="t" x="0" y="612">  P1          338        615      780</text>
    <text class="t" x="0" y="628">  P2          618        645      780</text>
    <text class="green" x="0" y="644">  P3          796        680      780</text><text class="dim" x="392" y="644">← base</text>
    <text class="t" x="0" y="660">  P4          928        725      780</text>
    <text class="t" x="0" y="676">  P5          952        780      780</text>
    <text class="t" x="0" y="692">  P6         1056        780      780</text><text class="dim" x="392" y="692">+104 MHz (same V)</text>
    <text class="dim" x="0" y="708">  ···</text>
    <text class="red" x="0" y="724">  P15        1578       1055     1055</text><text class="dim" x="392" y="724">← peak</text>

    <text class="bold" x="0" y="748">  Voltage corners:</text>
    <text class="t" x="0" y="764">     780 mV: 952 ↔ 1056 MHz (Δ104)    905 mV: 1204 ↔ 1338 MHz (Δ134)</text>
  </g>
</svg>
